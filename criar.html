<!DOCTYPE html>
<html>
<head>
  <title>Criar Personagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0a0f2c;
      font-family: Arial;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      color: #f5c542;
    }

    input, textarea {
      width: 85%;
      max-width: 320px;
      padding: 12px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    textarea {
      height: 80px;
    }

    button {
      width: 85%;
      max-width: 320px;
      padding: 15px;
      margin: 10px;
      border-radius: 12px;
      border: none;
      background-color: #f5c542;
      font-size: 18px;
      cursor: pointer;
    }

    .foto {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #222;
      margin: 10px auto;
      overflow: hidden;
    }

    .foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .inventario {
      margin-top: 20px;
    }

    .item {
      display: inline-block;
      padding: 10px;
      margin: 5px;
      background: #222;
      border-radius: 10px;
      cursor: pointer;
    }

    .selecionado {
      background: #00cc66;
      color: black;
    }

    .loading {
      display: none;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>🧙 CRIAR PERSONAGEM</h1>

  <input id="nome" placeholder="Nome do personagem">

  <div class="foto">
    <img id="preview">
  </div>

  <input type="file" accept="image/*" onchange="carregarFoto()">
  <p>(opcional)</p>

  <textarea id="desc" placeholder="Descrição do personagem... 😎🔥"></textarea>
  <p>(opcional)</p>

  <h3>🎒 Inventário (Escolha 2)</h3>

  <div class="inventario" id="inv">
    <div class="item" onclick="selecionar(this)">🗡️ Espada</div>
    <div class="item" onclick="selecionar(this)">🛡️ Escudo</div>
    <div class="item" onclick="selecionar(this)">🧪 Poção</div>
    <div class="item" onclick="selecionar(this)">🏹 Arco</div>
    <div class="item" onclick="selecionar(this)">🔥 Magia</div>
    <div class="item" onclick="selecionar(this)">💎 Cristal</div>
  </div>

  <button onclick="criar()">Criar Personagem</button>

  <div class="loading" id="load">⏳ Criando personagem...</div>

  <script>
    let itensSelecionados = [];

    function selecionar(el) {
      let nome = el.innerText;

      if (itensSelecionados.includes(nome)) {
        itensSelecionados = itensSelecionados.filter(i => i !== nome);
        el.classList.remove("selecionado");
      } else {
        if (itensSelecionados.length >= 2) {
          alert("Você só pode escolher 2 itens!");
          return;
        }
        itensSelecionados.push(nome);
        el.classList.add("selecionado");
      }
    }

    function carregarFoto() {
      let file = event.target.files[0];
      let reader = new FileReader();

      reader.onload = function() {
        document.getElementById("preview").src = reader.result;
      };

      reader.readAsDataURL(file);
    }

    function criar() {
      let nome = document.getElementById("nome").value;
      let desc = document.getElementById("desc").value;
      let foto = document.getElementById("preview").src;

      if (nome === "") {
        alert("Digite um nome!");
        return;
      }

      // VERIFICA NOME REPETIDO
      let existente = localStorage.getItem("personagem_nome");
      if (existente === nome) {
        alert("Esse nome já está sendo usado!");
        return;
      }

      document.getElementById("load").style.display = "block";

      setTimeout(() => {

        localStorage.setItem("personagem_nome", nome);
        localStorage.setItem("personagem_desc", desc);
        localStorage.setItem("personagem_foto", foto);
        localStorage.setItem("personagem_itens", JSON.stringify(itensSelecionados));

        window.location.href = "index.html";

      }, 1500);
    }
  </script>

</body>
</html>
