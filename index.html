<!DOCTYPE html>
<html>
<head>
  <title>Criar Personagem</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0a0f2c;
      font-family: Arial;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      color: #f5c542;
    }

    .container {
      margin-top: 40px;
    }

    input {
      width: 80%;
      max-width: 300px;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-bottom: 20px;
    }

    button {
      width: 80%;
      max-width: 300px;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background-color: #f5c542;
      color: black;
      cursor: pointer;
      margin: 10px;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <h1>🧙 CRIAR PERSONAGEM</h1>

  <div class="container">

    <input id="nome" placeholder="Nome do personagem">

    <br>

    <button onclick="criar()">Criar Personagem</button>

    <br>

    <button onclick="voltar()">Voltar</button>

  </div>

  <script>
    function criar() {
      let nome = document.getElementById("nome").value;

      if (nome === "") {
        alert("Digite um nome!");
        return;
      }

      // salva personagem
      localStorage.setItem("personagem", nome);

      alert("Personagem criado com sucesso! 😎");

      window.location.href = "index.html";
    }

    function voltar() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
