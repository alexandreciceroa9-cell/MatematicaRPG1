<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matemática RPG - Início</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0f2c 0%, #1a1f4c 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      animation: fadeInDown 0.8s ease-out;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      margin-bottom: 50px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 48px;
      color: #f5c542;
      text-shadow: 
        0 0 20px rgba(245, 197, 66, 0.8),
        0 0 40px rgba(245, 197, 66, 0.4),
        0 2px 10px rgba(0, 0, 0, 0.8);
      margin-bottom: 15px;
      letter-spacing: 2px;
      animation: glow 2s ease-in-out infinite;
      font-weight: 800;
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 
          0 0 20px rgba(245, 197, 66, 0.8),
          0 0 40px rgba(245, 197, 66, 0.4),
          0 2px 10px rgba(0, 0, 0, 0.8);
      }
      50% {
        text-shadow: 
          0 0 30px rgba(245, 197, 66, 1),
          0 0 60px rgba(245, 197, 66, 0.6),
          0 2px 10px rgba(0, 0, 0, 0.8);
      }
    }

    .sub {
      color: #e0e0e0;
      font-size: 16px;
      margin: 10px 0;
      letter-spacing: 0.5px;
      animation: fadeIn 0.8s ease-out 0.3s both;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .alerta {
      color: #ff6b6b;
      margin: 20px 0;
      font-weight: bold;
      padding: 15px;
      background: rgba(255, 107, 107, 0.1);
      border: 2px solid #ff6b6b;
      border-radius: 12px;
      animation: slideInAlert 0.5s ease-out 0.5s both;
      display: none;
    }

    .alerta.show { display: block; }

    @keyframes slideInAlert {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .menu {
      margin-top: 40px;
      padding: 30px;
      background: rgba(20, 25, 50, 0.6);
      border: 2px solid rgba(245, 197, 66, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideInUp 0.8s ease-out 0.4s both;
    }

    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      width: 100%;
      padding: 18px 20px;
      margin: 12px 0;
      font-size: 18px;
      border-radius: 15px;
      border: 2px solid #f5c542;
      background: linear-gradient(135deg, rgba(245, 197, 66, 0.1), rgba(245, 197, 66, 0.05));
      color: #f5c542;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .principal {
      background: linear-gradient(135deg, #f5c542 0%,
