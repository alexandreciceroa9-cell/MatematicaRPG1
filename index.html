<!DOCTYPE html>
<html>
<head>
  <title>Matemática RPG</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to right, #001f3f, #00cc66);
      font-family: Arial;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TÍTULO MAIS NO TOPO */
    h1 {
      margin-top: 40px;
      font-size: 42px;
      text-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    .menu {
      margin-top: 60px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BOTÕES PROFISSIONAIS */
    button {
      width: 85%;
      max-width: 320px;
      padding: 20px;
      margin: 15px;
      font-size: 22px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(145deg, #003366, #00cc66);
      color: white;
      cursor: pointer;
      transition: 0.3s;

      /* SOMBRA */
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* HOVER (mouse) */
    button:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      background: linear-gradient(145deg, #00ff99, #006633);
    }

    /* CLIQUE / TOQUE */
    button:active {
      transform: scale(0.95);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

  <h1>Matemática RPG 🎮</h1>

  <div class="menu">
    <button onclick="alert('Iniciando aventura!')">Começar Aventura</button>
    <button onclick="alert('Criar personagem!')">Criar Personagem</button>
    <button onclick="alert('Ver personagem!')">Ver Personagem</button>
    <button onclick="alert('Abrindo ranks!')">Ranks</button>
  </div>

</body>
</html>
